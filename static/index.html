<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuminDub</title>
<meta name="description" content="AI video dubbing in Moroccan Darija, Egyptian, Gulf Arabic, French and English.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#181c30;--line:#2a3050;--txt:#eef0fa;--mut:#9aa3c7;--acc:#7c5cff;--acc2:#22d3ee;--ok:#22c55e;--err:#ef4444}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Cairo',system-ui,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-weight:700;font-size:1.3rem;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{width:auto;padding:6px 10px;border-radius:999px}
.hero{text-align:center;padding:28px 0 12px}
.hero h1{margin:0;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.3}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:12px auto 20px;max-width:560px}
.cta{display:inline-block;padding:13px 28px;border-radius:12px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(90deg,var(--acc),var(--acc2))}
section{margin-top:40px}
h2.sec{font-size:1.25rem;margin:0 0 14px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.mini b{display:block;margin-bottom:4px}
.mini p{margin:0;color:var(--mut);font-size:.9rem}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;margin-bottom:8px}
.exs{display:grid;gap:12px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.ex .src{color:var(--mut);margin-bottom:8px;direction:ltr;text-align:start}
.ex .o{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.ex .o span:first-child{flex:none;width:110px;color:var(--acc2);font-size:.85rem}
.ex .o span:last-child{direction:rtl}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px}
h2{font-size:1.05rem;margin:0 0 12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;cursor:pointer;color:var(--mut);transition:.2s}
.drop:hover,.drop.on{border-color:var(--acc);color:var(--txt)}
.drop b{color:var(--txt)}
.langs,.tabs{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0}
.chip span,.tab{display:block;padding:8px 16px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--mut);transition:.15s;background:none;font:inherit}
.chip input:checked+span,.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
label.inline{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--mut)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--mut);cursor:pointer;margin-top:14px}
button.main{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--acc),var(--acc2))}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.err{color:var(--err)}
.hint{color:var(--mut);font-size:.85rem;margin:0 0 12px}
select,textarea{width:100%;background:#10132a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{resize:vertical;min-height:62px}
details{color:var(--mut);font-size:.92rem}
details summary{cursor:pointer}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px}
.faq summary{color:var(--txt);font-weight:600}
.faq p{margin:8px 0 0}
.tool details{margin-top:14px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.ctl label{font-size:.82rem;color:var(--mut);display:block;margin-bottom:4px}
.seg{border-top:1px solid var(--line);padding:12px 0}
.src2{font-size:.82rem;color:var(--mut);margin-bottom:6px;direction:auto}
.edit{display:flex;gap:8px;align-items:flex-start}
.play{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#10132a;color:var(--acc2);font-size:1.1rem;cursor:pointer}
.res{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.res:first-of-type{border:0;padding:0;margin:0}
video{width:100%;border-radius:10px;background:#000;margin:8px 0}
a.dl{color:var(--acc2);text-decoration:none;font-weight:600;margin-inline-end:16px}
.badge{margin-inline-start:10px;font-size:.8rem;color:var(--ok)}
.lsbox{margin:6px 0 10px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.hidden{display:none}
.note{font-size:.82rem;color:var(--mut);text-align:center;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="logo">LuminDub</span>
    <select id="uiLang" class="lang" aria-label="Language">
      <option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option>
    </select>
  </div>

  <div class="hero">
    <h1 data-i18n="hero_h"></h1>
    <p data-i18n="hero_p"></p>
    <a class="cta" href="#tool" data-i18n="cta"></a>
  </div>

  <section>
    <h2 class="sec" data-i18n="how_t"></h2>
    <div class="grid">
      <div class="mini"><span class="num">1</span><b data-i18n="s1_t"></b><p data-i18n="s1_d"></p></div>
      <div class="mini"><span class="num">2</span><b data-i18n="s2_t"></b><p data-i18n="s2_d"></p></div>
      <div class="mini"><span class="num">3</span><b data-i18n="s3_t"></b><p data-i18n="s3_d"></p></div>
    </div>
  </section>

  <section>
    <h2 class="sec" data-i18n="ex_t"></h2>
    <p class="hint" style="text-align:center" data-i18n="ex_n"></p>
    <div class="exs" id="examples"></div>
  </section>

  <section>
    <h2 class="sec" data-i18n="feat_t"></h2>
    <div class="grid">
      <div class="mini"><b data-i18n="f1_t"></b><p data-i18n="f1_d"></p></div>
      <div class="mini"><b data-i18n="f2_t"></b><p data-i18n="f2_d"></p></div>
      <div class="mini"><b data-i18n="f3_t"></b><p data-i18n="f3_d"></p></div>
      <div class="mini"><b data-i18n="f4_t"></b><p data-i18n="f4_d"></p></div>
    </div>
  </section>

  <section id="tool" class="tool">
    <h2 class="sec" data-i18n="tool_t"></h2>
    <div id="setup">
      <div class="card">
        <h2 data-i18n="c1_t"></h2>
        <div class="drop" id="drop">
          <div id="dropText"><span data-i18n="drop_a"></span> <b data-i18n="drop_b"></b><br><small data-i18n="drop_h"></small></div>
          <input type="file" id="file" accept="video/*" class="hidden">
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="c2_t"></h2>
        <div class="langs" id="langs"></div>
        <details>
          <summary data-i18n="gl_s"></summary>
          <p class="hint" data-i18n="gl_h"></p>
          <textarea id="glossary" data-i18n-ph="gl_p"></textarea>
        </details>
      </div>

      <div class="card">
        <h2 data-i18n="c3_t"></h2>
        <div class="row">
          <label class="inline"><input type="radio" name="g" value="male" checked> <span data-i18n="male"></span></label>
          <label class="inline"><input type="radio" name="g" value="female"> <span data-i18n="female"></span></label>
        </div>
        <label class="check"><input type="checkbox" id="review" checked><span data-i18n="rev_chk"></span></label>
        <label class="check"><input type="checkbox" id="consent"><span data-i18n="con_chk"></span></label>
        <button class="main" id="go" disabled data-i18n="go"></button>
      </div>
    </div>

    <div class="card hidden" id="progress">
      <h2 id="step"></h2>
      <div class="bar"><i id="fill"></i></div>
      <div id="perr" class="err"></div>
    </div>

    <div class="card hidden" id="reviewCard">
      <h2 data-i18n="rev_t"></h2>
      <p class="hint" data-i18n="rev_h"></p>
      <div class="tabs" id="tabs"></div>
      <div id="panels"></div>
      <div class="ctl">
        <div><label data-i18n="speed"></label>
          <select id="rate">
            <option value="" data-i18n="sp0"></option><option value="-15%" data-i18n="sp1"></option>
            <option value="-8%" data-i18n="sp2"></option><option value="+8%" data-i18n="sp3"></option>
            <option value="+15%" data-i18n="sp4"></option>
          </select></div>
      </div>
      <button class="main" id="renderBtn" data-i18n="render"></button>
    </div>

    <div class="card hidden" id="results"><h2 data-i18n="res_t"></h2><div id="list"></div></div>
  </section>

  <section class="faq">
    <h2 class="sec" data-i18n="faq_t"></h2>
    <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
    <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
    <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
    <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
    <details><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
  </section>

  <p class="note" data-i18n="foot"></p>
</div>

  f4_t:'Free and private', f4_d:'No account needed. Your files are deleted automatically after one hour.',
  tool_t:'Start dubbing', c1_t:'1. Video', drop_a:'Drop your video here or', drop_b:'click to choose',
  drop_h:'Up to 50 MB and 3 minutes (MP4 / MOV / WebM)',
  c2_t:'2. Languages and dialects', gl_s:'Your glossary (optional)',
  gl_h:'One term per line. Example: YouTube=يوتيوب, or a brand name to keep as is.', gl_p:'LuminDub\ncourse=الكورس',
  c3_t:'3. Voice and options', male:'Male voice', female:'Female voice',
  rev_chk:'I want to review and edit the text and hear a preview before dubbing (recommended)',
  con_chk:'I confirm I own the rights to this video or have permission to dub it, and will not use the tool to impersonate or deceive.',
  go:'Start', rev_t:'Review the text', rev_h:'Edit any line you like and press ▶ to hear it before continuing.',
  voice:'Voice', speed:'Speaking speed (all languages)', sp0:'Default', sp1:'Much slower', sp2:'Slower', sp3:'Faster', sp4:'Much faster',
  render:'Dub with this text', res_t:'Results', dl_v:'Download video', dl_s:'Download subtitles (SRT)', txt:'Translated text',
  faq_t:'FAQ',
  q1:'Is it free?', a1:'Yes in this test version, with a daily limit per visitor.',
  q2:'Is my voice cloned?', a2:'No. We use ready-made neural voices; voice cloning is planned.',
  q3:'What are the limits?', a3:'Up to 50 MB and 3 minutes. The first request can take about a minute after idle time.',
  q4:'Are my files stored?', a4:'They are deleted from the server after one hour. For processing, audio and text are sent to Groq, Google and Microsoft, and the video to Sync.so if you choose lip-sync.',
  q5:'Is lip-sync included?', a5:'Yes, as an optional experimental feature via Sync.so, for short videos (up to 20 seconds). Works best with a single front-facing face.',
  ls_chk:'Lip-sync this language (experimental)', ls_hint:'The video and audio are sent to Sync.so. Limit: {s} seconds, a few extra minutes. If it fails you get the normal version.', ls_long:'Your video is longer than {s} seconds, so lip-sync is not available for it.', ls_badge:'Lip-synced ✓',
  foot:'The test version uses ready-made neural voices (not a clone of your voice). Files are deleted after one hour.',
  uploading:'Uploading video...', stopped:'Processing stopped', expired:'Job expired (deleted after one hour)',
  big:'File is larger than 50 MB', pick:'Pick at least one language', up_fail:'Upload failed', start_fail:'Could not start', prev_fail:'Preview unavailable',
  n_rev:'Text is ready for review', n_done:'Dubbing finished ✅', preview:'Preview'
}};

const LABELS = {
  darija:{ar:'الدارجة المغربية',fr:'Darija marocain',en:'Moroccan Darija'},
  egyptian:{ar:'العامية المصرية',fr:'Arabe égyptien',en:'Egyptian Arabic'},
  gulf:{ar:'اللهجة الخليجية',fr:'Arabe du Golfe',en:'Gulf Arabic'},
  fr:{ar:'الفرنسية',fr:'Français',en:'French'},
  en:{ar:'الإنجليزية',fr:'Anglais',en:'English'}
};
const EXAMPLES = [
  {src:"Let's get started, it's very easy.", darija:'يالاه نبداو، ساهلة بزاف.', egyptian:'يلا نبدأ، سهلة أوي.', gulf:'يالله نبدأ، سهلة وايد.'},
  {src:'What do you think?', darija:'شنو كتشوف؟', egyptian:'رأيك إيه؟', gulf:'شرايك؟'},
  {src:'I want to show you something.', darija:'بغيت نوريك شي حاجة.', egyptian:'عايز أوريك حاجة.', gulf:'أبي أوريك شي.'}
];
const STEP_MAP = [
  ['في قائمة الانتظار', {fr:"En file d'attente", en:'Queued'}],
  ['استخراج الصوت', {fr:"Extraction de l'audio", en:'Extracting audio'}],
  ['التعرف على الكلام', {fr:'Reconnaissance vocale', en:'Recognizing speech'}],
  ['ترجمة وتكييف كل اللغات معاً', {fr:'Traduction et adaptation', en:'Translating and adapting'}],
  ['توليد الصوت', {fr:'Génération de la voix', en:'Generating voice'}],
  ['دمج الفيديو', {fr:'Montage de la vidéo', en:'Merging video'}],
  ['مطابقة الشفاه', {fr:'Synchronisation labiale', en:'Lip-syncing'}],
  ['اكتمل', {fr:'Terminé', en:'Done'}]
];

const $ = s => document.querySelector(s);
const safe = fn => { try { return fn(); } catch (e) { return null; } };
let UI = safe(() => localStorage.getItem('lumindub_ui')) || (navigator.language || 'ar').slice(0, 2);
if (!I18N[UI]) UI = 'ar';
const t = k => (I18N[UI] && I18N[UI][k]) || I18N.ar[k] || k;
const lbl = k => (LABELS[k] && LABELS[k][UI]) || k;
const stepText = s => {
  if (UI === 'ar') return s;
  for (const [ar, tr] of STEP_MAP) if (s.startsWith(ar)) {
    const rest = s.slice(ar.length).replace(/^:\s*/, '');
    return tr[UI] + (rest ? ' — ' + (Object.keys(LABELS).find(k => LABELS[k].ar === rest) ? lbl(Object.keys(LABELS).find(k => LABELS[k].ar === rest)) : rest) : '');
  }
  return s;
};

const KEY = 'lumindub_job';
let LANGS = {}, fileObj = null, jobId = null, reviewShown = false, lastJob = null;
const shown = new Set();

function applyUI() {
  document.documentElement.lang = UI;
  document.documentElement.dir = UI === 'ar' ? 'rtl' : 'ltr';
  $('#uiLang').value = UI;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  if (fileObj) setFileLabel(); else $('#dropText').innerHTML = `<span>${t('drop_a')}</span> <b>${t('drop_b')}</b><br><small>${t('drop_h')}</small>`;
  document.title = 'LuminDub';
  renderExamples(); renderChips();
  if (lastJob) { $('#step').textContent = stepText(lastJob.step || ''); }
}
$('#uiLang').onchange = e => { UI = e.target.value; safe(() => localStorage.setItem('lumindub_ui', UI)); applyUI(); rebuildDynamic(); };

function renderExamples() {
  const box = $('#examples'); box.innerHTML = '';
  EXAMPLES.forEach(x => {
    const d = document.createElement('div'); d.className = 'ex';
    const s = document.createElement('div'); s.className = 'src'; s.textContent = t('ex_src') + ': ' + x.src; d.appendChild(s);
    ['darija', 'egyptian', 'gulf'].forEach(k => {
      const o = document.createElement('div'); o.className = 'o';
      const a = document.createElement('span'); a.textContent = lbl(k);
      const b = document.createElement('span'); b.textContent = x[k]; o.append(a, b); d.appendChild(o);
    });
    box.appendChild(d);
  });
}

function renderChips() {
  const box = $('#langs');
  const prev = new Set([...box.querySelectorAll('input:checked')].map(i => i.value));
  const first = box.children.length === 0;
  const keys = Object.keys(LANGS);
  box.innerHTML = keys.map(k => {
    const on = first ? ['darija', 'egyptian', 'gulf'].includes(k) : prev.has(k);
    return `<label class="chip"><input type="checkbox" value="${k}" ${on ? 'checked' : ''}><span>${lbl(k)}</span></label>`;
  }).join('');
}

fetch('/api/languages').then(r => r.json()).then(L => {
  LANGS = L; renderChips();
  const saved = safe(() => localStorage.getItem(KEY));
  if (saved) { jobId = saved; $('#progress').classList.remove('hidden'); poll(); }
});

const drop = $('#drop'), fileIn = $('#file');
drop.onclick = () => fileIn.click();
['dragover', 'dragenter'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('on'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', ev => setFile(ev.dataTransfer.files[0]));
fileIn.onchange = () => setFile(fileIn.files[0]);
function setFileLabel() {
  $('#dropText').innerHTML = '<b></b><br><small></small>';
  $('#dropText b').textContent = fileObj.name;
  $('#dropText small').textContent = (fileObj.size / 1048576).toFixed(1) + ' MB';
}
function setFile(f) {
  if (!f) return;
  if (f.size > 50 * 1024 * 1024) { alert(t('big')); return; }
  fileObj = f; setFileLabel(); check();
}
function check() { $('#go').disabled = !(fileObj && $('#consent').checked); }
$('#consent').onchange = check;

function resetUI() {
  shown.clear(); reviewShown = false; lastJob = null;
  Object.keys(RES).forEach(k => delete RES[k]);
  $('#list').innerHTML = ''; $('#results').classList.add('hidden');
  $('#reviewCard').classList.add('hidden'); $('#perr').textContent = '';
}

$('#go').onclick = async () => {
  const langs = [...document.querySelectorAll('#langs input:checked')].map(i => i.value);
  if (!langs.length) { alert(t('pick')); return; }
  if ('Notification' in window && Notification.permission === 'default') safe(() => Notification.requestPermission());
  const fd = new FormData();
  fd.append('file', fileObj); fd.append('langs', langs.join(','));
  fd.append('gender', document.querySelector('input[name=g]:checked').value);
  fd.append('consent', $('#consent').checked);
  fd.append('review', $('#review').checked);
  fd.append('glossary', $('#glossary').value);
  $('#go').disabled = true; resetUI();
  $('#progress').classList.remove('hidden');
  $('#step').textContent = t('uploading'); $('#fill').style.width = '2%';
  try {
    const r = await fetch('/api/jobs', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || t('up_fail'));
    jobId = (await r.json()).job_id;
    safe(() => localStorage.setItem(KEY, jobId));
    poll();
  } catch (e) { $('#perr').textContent = e.message; $('#go').disabled = false; }
};

async function poll() {
  let j;
  try {
    const r = await fetch('/api/jobs/' + jobId);
    if (r.status === 404) { stop(t('expired')); return; }
    j = await r.json();
  } catch (e) { setTimeout(poll, 4000); return; }
  lastJob = j;

  if (j.status === 'review') {
    $('#progress').classList.add('hidden');
    if (!reviewShown) { buildReview(j); notify(t('n_rev')); }
    return;
  }
  $('#progress').classList.remove('hidden');
  $('#step').textContent = stepText(j.step); $('#fill').style.width = j.progress + '%';
  renderResults(j.outputs || {});
  if (j.status === 'done') { stop(); notify(t('n_done')); return; }
  if (j.status === 'error') { stop(j.error); return; }
  setTimeout(poll, 2500);
}

function stop(msg) {
  safe(() => localStorage.removeItem(KEY));
  $('#go').disabled = !(fileObj && $('#consent').checked);
  if (msg) { $('#perr').textContent = msg; $('#progress').classList.remove('hidden'); $('#step').textContent = t('stopped'); }
}

function notify(text) {
  document.title = text + ' - LuminDub';
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') safe(() => new Notification('LuminDub', { body: text }));
}

/* -------- مراجعة النص -------- */
let audio = null;
function buildReview(j) {
  reviewShown = true;
  const d = j.draft, keys = j.langs;
  $('#reviewCard').classList.remove('hidden');
  $('#tabs').innerHTML = ''; $('#panels').innerHTML = '';
  keys.forEach((k, idx) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (idx === 0 ? ' on' : ''); tab.textContent = lbl(k); tab.dataset.k = k;
    tab.onclick = () => showTab(k);
    $('#tabs').appendChild(tab);

    const p = document.createElement('div'); p.dataset.panel = k;
    if (idx) p.classList.add('hidden');
    const ctl = document.createElement('div'); ctl.className = 'ctl';
    const wrap = document.createElement('div');
    const lb = document.createElement('label'); lb.textContent = t('voice'); lb.dataset.i18n = 'voice';
    const sel = document.createElement('select'); sel.id = 'v_' + k;
    let picked = false;
    LANGS[k].voices.forEach(v => {
      const o = document.createElement('option'); o.value = v.id; o.textContent = v.label;
      if (!picked && v.gender === j.gender) { o.selected = true; picked = true; }
      sel.appendChild(o);
    });
    wrap.append(lb, sel); ctl.appendChild(wrap); p.appendChild(ctl);
    const ls = d.lipsync || {};
    if (ls.enabled) {
      const box = document.createElement('div'); box.className = 'lsbox';
      if (ls.duration <= ls.max_seconds) {
        const lab = document.createElement('label'); lab.className = 'check'; lab.style.marginTop = '0';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'ls_' + k; cb.dataset.ls = k;
        const sp = document.createElement('span'); sp.dataset.i18n = 'ls_chk'; sp.textContent = t('ls_chk');
        lab.append(cb, sp);
        const h = document.createElement('p'); h.className = 'hint'; h.dataset.i18n = 'ls_hint'; h.dataset.n = ls.max_seconds;
        h.textContent = t('ls_hint').replace('{s}', ls.max_seconds);
        box.append(lab, h);
      } else {
        const h = document.createElement('p'); h.className = 'hint'; h.dataset.i18n = 'ls_long'; h.dataset.n = ls.max_seconds;
        h.textContent = t('ls_long').replace('{s}', ls.max_seconds); box.append(h);
      }
      p.appendChild(box);
    }
    d.texts[k].forEach((line, i) => {
      const seg = document.createElement('div'); seg.className = 'seg';
      const src = document.createElement('div'); src.className = 'src2'; src.textContent = d.segments[i].text;
      const ed = document.createElement('div'); ed.className = 'edit';
      const ta = document.createElement('textarea'); ta.dir = 'auto'; ta.value = line.text; ta.dataset.k = k;
      const pb = document.createElement('button'); pb.className = 'play'; pb.textContent = '▶'; pb.title = t('preview');
      pb.onclick = () => preview(k, ta.value, pb);
      ed.append(ta, pb); seg.append(src, ed); p.appendChild(seg);
    });
    $('#panels').appendChild(p);
  });
}
function showTab(k) {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.k === k));
  document.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== k));
}
async function preview(k, text, btn) {
  if (!text.trim()) return;
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await fetch(`/api/jobs/${jobId}/preview`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lang: k, text, voice: $('#v_' + k).value, rate: $('#rate').value || undefined })
    });
    if (!r.ok) throw new Error((await r.json()).detail || t('prev_fail'));
    if (audio) audio.pause();
    audio = new Audio((await r.json()).url); await audio.play();
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = '▶';
}

$('#renderBtn').onclick = async () => {
  const texts = {}, voices = {};
  document.querySelectorAll('#panels textarea').forEach(ta => { (texts[ta.dataset.k] ||= []).push(ta.value); });
  Object.keys(texts).forEach(k => voices[k] = $('#v_' + k).value);
  $('#renderBtn').disabled = true;
  try {
    const r = await fetch(`/api/jobs/${jobId}/render`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texts, voices, rate: $('#rate').value || undefined,
        lipsync: [...document.querySelectorAll('#panels input[data-ls]:checked')].map(x => x.dataset.ls) })
    });
    if (!r.ok) throw new Error((await r.json()).detail || t('start_fail'));
    $('#reviewCard').classList.add('hidden'); reviewShown = true;
    $('#progress').classList.remove('hidden'); $('#fill').style.width = '1%';
    poll();
  } catch (e) { alert(e.message); }
  $('#renderBtn').disabled = false;
};

/* -------- النتائج -------- */
let OUTPUTS = {};
const RES = {};
function renderResults(o) {
  OUTPUTS = o;
  const keys = Object.keys(o); if (!keys.length) return;
  $('#results').classList.remove('hidden');
  keys.forEach(k => {
    const x = o[k];
    if (shown.has(k)) {  // تحديث عنصر موجود (مثلاً بعد اكتمال مطابقة الشفاه)
      const r = RES[k];
      if (r.url !== x.url) { r.url = x.url; r.v.src = x.url; r.a.href = x.url; }
      if (x.lipsync && !r.badge.textContent) r.badge.textContent = t('ls_badge');
      if (x.note) r.note.textContent = x.note;
      return;
    }
    shown.add(k);
    const d = document.createElement('div'); d.className = 'res'; d.dataset.k = k;
    const b = document.createElement('b'); b.className = 'rl'; b.textContent = lbl(k);
    const badge = document.createElement('span'); badge.className = 'badge';
    if (x.lipsync) badge.textContent = t('ls_badge');
    const note = document.createElement('p'); note.className = 'hint err'; note.textContent = x.note || '';
    const v = document.createElement('video'); v.controls = true; v.src = x.url; v.preload = 'metadata';
    const a = document.createElement('a'); a.className = 'dl'; a.href = x.url; a.download = ''; a.dataset.i18n = 'dl_v'; a.textContent = t('dl_v');
    const s2 = document.createElement('a'); s2.className = 'dl'; s2.href = x.srt; s2.download = ''; s2.dataset.i18n = 'dl_s'; s2.textContent = t('dl_s');
    const det = document.createElement('details'); const sm = document.createElement('summary'); sm.dataset.i18n = 'txt'; sm.textContent = t('txt');
    const p = document.createElement('p'); p.textContent = x.text; det.append(sm, p);
    d.append(b, badge, note, v, a, s2, det); $('#list').appendChild(d);
    RES[k] = { url: x.url, v, a, badge, note };
  });
}

// يحدّث النصوص المبنية ديناميكياً عند تغيير لغة الواجهة
function rebuildDynamic() {
  document.querySelectorAll('.tab').forEach(x => { x.textContent = lbl(x.dataset.k); });
  document.querySelectorAll('.res').forEach(r => { r.querySelector('.rl').textContent = lbl(r.dataset.k); });
  document.querySelectorAll('.play').forEach(b => { b.title = t('preview'); });
  document.querySelectorAll('#list [data-i18n], #panels [data-i18n]').forEach(e => {
    if (!e.dataset.i18n) return;
    e.textContent = t(e.dataset.i18n).replace('{s}', e.dataset.n || '');
  });
  document.querySelectorAll('.badge').forEach(e => { if (e.textContent) e.textContent = t('ls_badge'); });
}

applyUI();
</script>
</body>
</html>
